<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">YouTube Studio MCP terminal demo</title>
  <desc id="desc">A terminal-style demo showing the YouTube Studio MCP setup and example assistant prompt.</desc>
  <rect width="920" height="500" rx="20" fill="#111827"/>
  <rect x="0" y="0" width="920" height="56" rx="20" fill="#1f2937"/>
  <circle cx="32" cy="28" r="8" fill="#ff5f56"/>
  <circle cx="58" cy="28" r="8" fill="#ffbd2e"/>
  <circle cx="84" cy="28" r="8" fill="#27c93f"/>
  <text x="120" y="34" fill="#d1d5db" font-family="SFMono-Regular, Consolas, monospace" font-size="16">youtube-studio-mcp demo</text>
  <text x="36" y="96" fill="#93c5fd" font-family="SFMono-Regular, Consolas, monospace" font-size="18">$ git clone https://github.com/Shaazakhtar/youtube-studio-mcp.git</text>
  <text x="36" y="132" fill="#93c5fd" font-family="SFMono-Regular, Consolas, monospace" font-size="18">$ cd youtube-studio-mcp</text>
  <text x="36" y="168" fill="#93c5fd" font-family="SFMono-Regular, Consolas, monospace" font-size="18">$ python3 scripts/auth.py auth</text>
  <text x="36" y="204" fill="#a7f3d0" font-family="SFMono-Regular, Consolas, monospace" font-size="18">Saved OAuth token to secrets/token.json</text>
  <text x="36" y="258" fill="#fef3c7" font-family="SFMono-Regular, Consolas, monospace" font-size="18">Ask your MCP client:</text>
  <text x="36" y="298" fill="#f9fafb" font-family="SFMono-Regular, Consolas, monospace" font-size="20">"Show my channel overview and summarize my last 10 videos."</text>
  <text x="36" y="358" fill="#a7f3d0" font-family="SFMono-Regular, Consolas, monospace" font-size="18">Tools available: overview, videos, metadata updates, thumbnails, analytics, comments</text>
  <text x="36" y="420" fill="#fb7185" font-family="SFMono-Regular, Consolas, monospace" font-size="18">Credentials stay local in secrets/ and are ignored by git.</text>
</svg>
